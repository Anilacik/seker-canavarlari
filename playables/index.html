    return oST(function () { if (paused) deferred.push(function () { fn.apply(window, args); }); else fn.apply(window, args); }, ms);
  };

  });

    splash.innerHTML = '<div style="font-size:30px;text-align:center;padding:0 20px">' + ((LANG === 'en' && CFG.titleEn) || CFG.title || '') + '</div>' +

<script type="text/yt-deferred">
// ===== Şeker Canavarları — kurallar =====
// L: {n,x[],r[],links:[{a,b}] (a=-1 çubuk), c[], q[] renk ('j' = joker, her rengi yer), qw[] 1|2 (obur=2), K kavanoz yeri, lock: renk|null, sh[] kabuk}
// S: alive[], rack[], qi, un (kilit açık), sh[], cl[] (makasla kesilen karamel), xl[] (kepçeyle birleşen yeni karameller {a,b})
function P_new(L){return {alive:new Array(L.n).fill(true),rack:[],qi:0,un:false,sh:(L.sh||[]).slice(),cl:new Array(L.links.length).fill(false),xl:[]};}
function P_clone(S){return {alive:S.alive.slice(),rack:S.rack.slice(),qi:S.qi,un:S.un,sh:S.sh.slice(),cl:S.cl.slice(),xl:S.xl.map(l=>({...l}))};}
function P_cap(L,S){return L.K+(L.lock&&S.un?1:0);}
function P_allLinks(L,S){const o=[];L.links.forEach((l,k)=>{if(!S.cl[k])o.push(l);});S.xl.forEach(l=>o.push(l));return o;}
function P_conn(L,S,skip){const ok=new Array(L.n).fill(false);let ch=true;const al=i=>S.alive[i]&&i!==skip;const LK=P_allLinks(L,S);
  LK.forEach(l=>{if(l.a<0&&al(l.b))ok[l.b]=true;});
  // karamel iki yönlü tutar: bağlı iki şekerden biri çubuğa ulaşıyorsa diğeri de ulaşır
  while(ch){ch=false;LK.forEach(l=>{if(l.a<0||!al(l.a)||!al(l.b))return;if(ok[l.a]&&!ok[l.b]){ok[l.b]=true;ch=true;}else if(ok[l.b]&&!ok[l.a]){ok[l.a]=true;ch=true;}});}return ok;}
function P_moves(L,S){const m=[];for(let i=0;i<L.n;i++)if(S.alive[i])m.push(i);return m;}
function P_drop(L,S,first){const ok=P_conn(L,S,-1);const fell=[];for(let j=0;j<L.n;j++)if(S.alive[j]&&!ok[j]){S.alive[j]=false;fell.push(j);}
  fell.sort((a,b)=>(a===first?-1:b===first?1:L.r[a]-L.r[b]||L.x[a]-L.x[b]));S.rack.push(...fell);return fell;}
// dokun: şeker karamelinden kopar; çubuğa bağlı kalmayanlar da kavanoza düşer
function P_tap(L,S,i){if(!S.alive[i])return null;if(S.sh[i]>0){S.sh[i]--;return {fell:[],served:[],cracked:i};}const ok=P_conn(L,S,i);const fell=[];
  for(let j=0;j<L.n;j++)if(S.alive[j]&&!ok[j]){S.alive[j]=false;fell.push(j);}
  fell.sort((a,b)=>(a===i?-1:b===i?1:L.r[a]-L.r[b]||L.x[a]-L.x[b]));S.rack.push(...fell);const served=P_serve(L,S);return {fell,served};}
// denge: joker/atıştırmalık bir şeker aldığında o renkteki son canavar sıradan çıkar
function P_dropMonster(L,S,x){for(let k=L.q.length-1;k>=S.qi;k--){if(L.q[k]===x){if(L.qw[k]===2)L.qw[k]=1;else{L.q.splice(k,1);L.qw.splice(k,1);}return k;}}return -1;}
function P_serve(L,S){const out=[];while(S.qi<L.q.length){const c=L.q[S.qi],w=L.qw[S.qi];const idx=[];S.rack.forEach((i,j)=>{if((c==='j'||L.c[i]===c)&&idx.length<w)idx.push(j);});if(idx.length<w)break;
    const items=idx.map(j=>S.rack[j]);S.rack=S.rack.filter((_,j)=>!idx.includes(j));out.push({items,qi:S.qi,c,w});if(c==='j'){S.qi++;const gone=P_dropMonster(L,S,L.c[items[0]]);S.qi--;out[out.length-1].gone=gone;}if(L.lock&&c===L.lock&&!S.un){S.un=true;out[out.length-1].unlock=true;}S.qi++;}return out;}
// güç: öndeki canavarı şekersiz gönder

  tabs.querySelector('#tg').onclick=()=>{shopTab='g';shopScreen();};tabs.querySelector('#tk').onclick=()=>{shopTab='k';shopScreen();};if(shopTab==='k'){cosShop(l);refreshCoins();return;}Object.keys(SHOP).forEach(k=>{const it=SHOP[k];const d=document.createElement('div');d.className='item';
  const open=isOpen(k);if(!open)d.classList.add('locked');d.innerHTML='<div class="shopic">'+ICON[k]+'</div><div class="txt"><b>'+it.n+(it.pack>1?' ×'+it.pack:'')+'</b><span>'+it.d+'</span><em>'+(open?(it.life?'':'Sende: '+SV.inv[k]):'🔒 '+UNLOCK[k]+'. bölümde açılır')+'</em></div><button class="buyb"'+(open?'':' disabled')+'>'+(open?coinTag(it.price):'🔒')+'</button>';
  d.querySelector('.buyb').onclick=()=>{if(!open)return;if(buy(k))shopScreen();};l.appendChild(d);});refreshCoins();}
// ---------- canlar, günlük ödül, sandık ----------
const LIFE_MS=30*60*1000;
function livesNow(){if(SV.lives>=5){SV.lifeT=Date.now();return 5;}const n=Math.floor((Date.now()-SV.lifeT)/LIFE_MS);if(n>0){SV.lives=Math.min(5,SV.lives+n);SV.lifeT+=n*LIFE_MS;save();}return SV.lives;}
function lifeLeft(){if(livesNow()>=5)return '';const ms=LIFE_MS-(Date.now()-SV.lifeT);const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return m+':'+String(s).padStart(2,'0');}
function loseLife(){if(SV.inf||SV.st[LVN])return;livesNow();if(SV.lives>=5)SV.lifeT=Date.now();SV.lives=Math.max(0,SV.lives-1);save();refreshLives();}
function refreshLives(){const n=SV.inf?'∞':livesNow();const t=SV.inf?'':lifeLeft();document.querySelectorAll('.lifeN').forEach(e=>e.textContent=n+(t?' · '+t:''));}
function noLives(){pop('<div class="shopic">'+ICON.life+'</div><h3>Canın kalmadı!</h3><p>Her 30 dakikada 1 can dolar.<br>Sonraki can: <b class="lifeT">'+lifeLeft()+'</b></p><div class="btns"><button class="big" id="pL">Canları doldur · '+coinTag(SHOP.life.price)+'</button><button class="pill" id="pC">Bekle</button></div>');
  $('pL').onclick=()=>{if(buy('life')){closePop();refreshLives();}};$('pC').onclick=closePop;}
function canPlay(){if(SV.inf||livesNow()>0)return true;noLives();return false;}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
const yday=()=>{const d=new Date(Date.now()-864e5);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
const DAILY=[20,30,40,50,60,80,'box'];
function randBoost(){const ks=['hammer','scis','scoop','snack','mag','skip','taps','slot','joker'];return ks[Math.floor(Math.random()*ks.length)];}
function daily(){if(SV.daily.last===today())return false;const st=SV.daily.last===yday()?SV.daily.streak%7+1:1;
  const cells=DAILY.map((r,k)=>'<div class="dc'+(k+1<st?' done':k+1===st?' now':'')+'"><small>'+(k+1)+'. gün</small>'+(r==='box'?'<b>🎁</b>':'<b>'+r+'</b><i class="coin"></i>')+'</div>').join('');
  pop('<h3>Günlük ödül</h3><p style="margin:6px 0 10px">Her gün gel, ödül büyüsün!</p><div class="daily">'+cells+'</div><button class="big" id="pD" style="margin-top:14px">Al</button>');
  $('pD').onclick=()=>{const r=DAILY[st-1];let msg='';if(r==='box'){SV.coins+=120;const a=randBoost(),b=randBoost();SV.inv[a]++;SV.inv[b]++;msg='120 altın + '+SHOP[a].n+' + '+SHOP[b].n;}else{SV.coins+=r;msg=r+' altın';}
    SV.daily={last:today(),streak:st};save();refreshCoins();SFX.win();closePop();toast('Kazandın: '+msg);};return true;}
function totalStars(){return Object.values(SV.st).reduce((a,v)=>a+v,0);}
function chestInfo(){const t=totalStars();const avail=Math.floor(t/10)-SV.chests;return {avail,prog:t%10};}
function refreshChest(){const c=chestInfo();const b=$('chestBtn');b.classList.toggle('ready',c.avail>0);b.innerHTML='🎁 '+(c.avail>0?'Sandığı aç!':'Sandık '+c.prog+'/10 ★');}
function openChest(){const c=chestInfo();if(c.avail<=0){toast('10 yıldızda bir sandık açılır. Şu an '+c.prog+'/10');return;}SV.chests++;const a=randBoost(),b=randBoost();SV.coins+=50;SV.inv[a]++;SV.inv[b]++;save();refreshCoins();refreshChest();SFX.win();
  pop('<div style="font-size:64px;line-height:1">🎁</div><h3>Yıldız sandığı!</h3><p>+50 <i class="coin"></i><br>+1 '+SHOP[a].n+'<br>+1 '+SHOP[b].n+'</p><button class="big" id="pO">Süper!</button>');$('pO').onclick=closePop;}
// ---------- bölüm öncesi güçler ----------
function preLevel(n){const t=LEVELS[n-1].t;const pre=['slot','joker'].filter(isOpen);if(!pre.length){intro();return;}const sel={slot:false,joker:false};const chip=k=>'<button class="chip" id="ch_'+k+'"><span class="shopic">'+ICON[k]+'</span><b>'+SHOP[k].n+'</b><small>'+(SV.inv[k]>0?'Sende: '+SV.inv[k]:coinTag(SHOP[k].price))+'</small></button>';
  $('pop').classList.add('on');$('pop').innerHTML='<div class="card">'+((t==='z'||t==='c')?'<span class="new" style="background:'+(t==='c'?'#ff3d5a':'#ff9a3c')+'">'+(t==='c'?'ÇOK ZOR BÖLÜM':'ZOR BÖLÜM')+'</span>':'')+'<h3>Bölüm '+n+'</h3><p style="margin:6px 0 10px">'+LEVELS[n-1].lim+' dokunuş · kavanozda '+LEVELS[n-1].K+' yer<br><span style="font-size:14px">Bölüm öncesi güç seç (isteğe bağlı):</span></p><div class="chips">'+pre.map(chip).join('')+'</div><button class="big '+(t==='c'?'red':'pink')+'" id="pS" style="margin-top:14px">Başla</button></div>';
  pre.forEach(k=>{$('ch_'+k).onclick=()=>{if(!sel[k]&&SV.inv[k]<=0&&SV.coins<SHOP[k].price){toast('Altın yetmiyor');return;}sel[k]=!sel[k];$('ch_'+k).classList.toggle('on',sel[k]);};});
  $('pS').onclick=()=>{let base=LEVELS[n-1];const Lb={...base};['slot','joker'].forEach(k=>{if(!sel[k])return;if(SV.inv[k]>0)SV.inv[k]--;else SV.coins-=SHOP[k].price;});save();
    if(sel.slot)Lb.K=base.K+1;if(sel.joker){Lb.q=['j',...base.q];Lb.qw=[1,...base.qw];}LB=Lb;L=Lb;K=L.K;NCUP=K+(HASLOCK?1:0);layout();start();closePop();updHud();if(sel.slot||sel.joker)toast((sel.slot?'+1 kavanoz yeri ':'')+(sel.joker?'Joker canavar sırada!':''));};}
// ---------- ekranlar ----------
function show(id){refreshCoins();if(id==='shop')shopScreen();['home','levels','settings','shop'].forEach(k=>$(k).classList.toggle('on',k===id));$('hud').classList.toggle('on',id==='game');if(id!=='game')$('boost').classList.remove('on');closePop();if(id!=='game')G=null;if(id==='levels')grid();if(id==='home'){refreshChest();setTimeout(()=>{if($('home').classList.contains('on'))daily();},400);$('play').textContent=SV.un>LEVELS.length?'Bölümler':'Bölüm '+Math.min(SV.un,LEVELS.length);homeArt();}}
function goLevel(n){if(n>LEVELS.length)n=LEVELS.length;if(!SV.st[n]&&!canPlay())return;setLevel(n);show('game');start();updHud();
  const next=()=>{if(n>=11&&(LEVELS[n-1].t==='z'||LEVELS[n-1].t==='c'||(SV.fail&&SV.fail[n])))preLevel(n);else intro();};
  const nk=Object.keys(UNLOCK).find(k=>UNLOCK[k]===n&&!SV.seen[k]);if(nk){if(INTRO[n])intro(()=>powerCard(nk));else powerCard(nk,next);}else next();}
function powerCard(k,next){SV.seen[k]=1;SV.inv[k]+=2;save();updHud();const pre=SHOP[k].pre;
  pop('<span class="new" style="background:#2fb35f">YENİ GÜÇ AÇILDI!</span><div class="shopic lg">'+ICON[k]+'</div><h3>'+SHOP[k].n+'</h3><p>'+SHOP[k].d+(pre?'<br><b>Zor bölümlerin başında ve kaybettikten sonra seçebilirsin.</b>':'<br><b>Alttaki sıradan kullanabilirsin.</b>')+'<br>Denemen için <b>2 tane hediye!</b></p><button class="big" id="pP">Harika!</button>');
  SFX.win();$('pP').onclick=()=>{closePop();if(!pre&&G){G.hintBoost=k;updHud();}next&&next();};}
function grid(){const g=$('grid');g.innerHTML='';for(let n=1;n<=LEVELS.length;n++){const t=LEVELS[n-1].t;const open=SV.all||n<=SV.un;const b=document.createElement('button');b.className='lv'+(t==='z'?' hard':t==='c'?' vhard':'')+(open?'':' lock')+(n===SV.un?' cur':'');
  const st=SV.st[n]||0;b.innerHTML=(open?n:'🔒')+'<span class="st">'+(st?'★'.repeat(st):'')+'</span>';b.onclick=()=>{if(!open){toast('Önce önceki bölümleri geç');return;}ac();goLevel(n);};g.appendChild(b);}}
function homeArt(){const c=$('homeArt');const x2=c.getContext('2d');const old=ctx,oW=W,oLY=LY;ctx=x2;x2.setTransform(2,0,0,2,0,0);x2.clearRect(0,0,300,170);LY={...LY,UH:34,catR:24};
  [['r',40,40],['y',110,25],['b',190,30],['g',260,45],['p',150,70]].forEach(([c,x,y])=>candy(x,y,c,0));caramel(40,57,110,8+34);caramel(190,47,150,53);caramel(260,62,190,47);
  [['r',45],['y',105],['b',165],['g',225],['p',285]].forEach(([c,x],k)=>monster(x-15,140,20,c,{arms:k%2===0,open:k===2}));ctx=old;LY=oLY;}
$('play').onclick=()=>{ac();if(SV.un>LEVELS.length)show('levels');else goLevel(SV.un);};$('toLv').onclick=()=>{ac();show('levels');};$('toSet').onclick=()=>{$('optSnd').checked=SV.snd;$('optVib').checked=SV.vib;$('optAll').checked=SV.all;$('optInf').checked=SV.inf;show('settings');};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show('home'));$('toShop').onclick=()=>{ac();show('shop');};document.querySelectorAll('.coinpill').forEach(b=>b.onclick=()=>{ac();show('shop');});
$('optSnd').onchange=e=>{SV.snd=e.target.checked;save();};$('optVib').onchange=e=>{SV.vib=e.target.checked;save();};$('optAll').onchange=e=>{SV.all=e.target.checked;save();};
$('reset').onclick=()=>{SV.un=1;SV.st={};SV.coins=200;SV.inv={undo:1,hammer:0,skip:0,taps:0,mag:0,scis:0,scoop:0,snack:0,slot:0,joker:0};SV.seen={};SV.used={};SV.lives=5;SV.chests=0;save();toast('İlerleme sıfırlandı');};$('optInf').onchange=e=>{SV.inf=e.target.checked;save();refreshLives();};$('chestBtn').onclick=()=>{ac();openChest();};
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000)*(window.__SPEED||1);last=now;update(dt);draw();requestAnimationFrame(loop);}
addEventListener('resize',()=>{layout();});
setLevel(Math.min(SV.un,LEVELS.length));show('home');requestAnimationFrame(loop);
window.__K={L:()=>L,sxy:s=>[slotX(s),slotY(s)],lives:()=>livesNow(),G:()=>G,tap:i=>doTap(i),idle:()=>idle(),close:closePop,go:n=>goLevel(n),show};

})();

</script>
