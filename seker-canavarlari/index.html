<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Şeker Canavarları</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#4a1f3a;--sub:#8a5a78;--card:#fff8fc;--edge:#f0cfe0;--green:#3fc46f;--green-d:#24894a;--red:#ff5d6c;--red-d:#b82d3d;--gold:#ffc93a;--gold-d:#c48a00;--pink:#ff6fa8;--pink-d:#c43d77}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Baloo 2","Trebuchet MS",sans-serif;color:var(--ink);background:#ffe3f1}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(180deg,#ffc9e3,#ffe9f4 55%,#fff4e4)}
.scr.on{display:flex}
#hud{position:fixed;left:0;right:0;top:0;display:none;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}
#hud.on{display:flex}#hud>*{pointer-events:auto}
.ib{width:46px;height:46px;border-radius:15px;background:#fff;display:grid;place-items:center;border:0;box-shadow:0 4px 0 var(--edge),0 6px 14px rgba(120,40,80,.12);position:relative;cursor:pointer}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.ib svg{width:24px;height:24px}.ib.off{opacity:.45}
.ib .cnt{position:absolute;right:-7px;top:-7px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font:800 13px/22px "Baloo 2";text-align:center;padding:0 5px}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.tag{font:800 14px/1 "Baloo 2";color:#7a2a55;background:rgba(255,255,255,.85);border-radius:9px;padding:4px 10px}
.tag.hard{background:#ff9a3c;color:#fff}.tag.vhard{background:#ff3d5a;color:#fff}
.moves{display:flex;align-items:baseline;gap:5px;background:#fff;border-radius:16px;padding:1px 14px 3px;box-shadow:0 4px 0 var(--edge)}
.moves b{font:400 30px/1.1 "Lilita One";min-width:20px;text-align:center}.moves span{font:700 15px "Baloo 2";color:var(--sub)}
.moves.low{background:#ffe2e6}.moves.low b{color:var(--red-d)}
.rt{display:flex;gap:9px}.lt{display:flex;gap:9px}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(70,20,50,.38);padding:20px;z-index:5}
#pop.on{display:flex}
.card{width:100%;max-width:350px;background:var(--card);border-radius:28px;padding:22px 20px;text-align:center;box-shadow:0 16px 44px rgba(80,20,50,.3);animation:pp .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pp{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.card h3{margin:0;font:400 32px/1.05 "Lilita One"}
.card p{margin:10px 0 16px;font:600 16px/1.38 "Baloo 2";color:var(--sub)}
.card .new{display:inline-block;font:800 13px/1 "Baloo 2";color:#fff;background:var(--pink);border-radius:10px;padding:4px 10px;margin-bottom:6px}
.card canvas{position:static;width:150px;height:96px;display:block;margin:6px auto 0}
.big{min-width:220px;height:58px;border-radius:29px;border:0;font:400 24px/1 "Lilita One";color:#fff;background:linear-gradient(180deg,#5ad888,#2fb35f);box-shadow:0 6px 0 var(--green-d);cursor:pointer}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-d)}
.big.red{background:linear-gradient(180deg,#ff7d8a,#ef4456);box-shadow:0 6px 0 #b82d3d}
.big.pink{background:linear-gradient(180deg,#ff8dbd,#f0508f);box-shadow:0 6px 0 var(--pink-d)}
.pill{height:46px;padding:0 20px;border-radius:23px;font:800 17px "Baloo 2";background:#fff;box-shadow:0 5px 0 var(--edge)}
.pill:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.btns{display:flex;flex-direction:column;gap:12px;align-items:center}
.stars{font-size:46px;letter-spacing:6px;color:#ecd9e4;margin:6px 0 0}.stars .on{color:var(--gold);text-shadow:0 3px 0 var(--gold-d)}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(70,25,50,.88);color:#fff;font:700 17px/1.3 "Baloo 2";padding:10px 18px;border-radius:16px;display:none;pointer-events:none;text-align:center;max-width:86vw;z-index:6}
/* ana ekran */
#home{justify-content:space-between}
.logo{margin-top:7vh;text-align:center;line-height:.88}
.logo b{display:block;font:400 58px/0.95 "Lilita One";color:#fff;-webkit-text-stroke:3px #c43d77;paint-order:stroke fill;text-shadow:0 6px 0 #c43d77}
.logo span{display:block;margin-top:12px;font:800 18px "Baloo 2";color:#c43d77}
#homeArt{position:static;width:300px;height:170px}
.homebtns{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:6vh}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
h2{margin:6px 0 10px;font:400 30px "Lilita One"}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;max-width:400px;overflow:auto;padding:6px 4px 24px;touch-action:pan-y}
#levels{touch-action:pan-y}
.lv{aspect-ratio:1;border-radius:17px;background:#fff;font:400 22px "Lilita One";display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--edge);position:relative}
.lv.hard{background:#ffe1c9;box-shadow:0 4px 0 #f3b98a}.lv.vhard{background:#ffd0d8;color:var(--red-d);box-shadow:0 4px 0 #f19aa8}
.lv.lock{opacity:.45}.lv.cur{outline:4px solid var(--pink);outline-offset:-2px}
.lv .st{font-size:11px;color:var(--gold-d);letter-spacing:-1px;height:12px;line-height:12px;font-family:"Baloo 2"}
.set{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;margin-top:4px}
.set label{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:18px;padding:12px 16px;font-size:17px;font-weight:800;box-shadow:0 3px 0 var(--edge)}
.set input{width:26px;height:26px;accent-color:var(--pink)}
.legend{font:700 13px "Baloo 2";color:var(--sub);margin-top:4px;text-align:center}
i.coin{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:-4px;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc928 45%,#d49300);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15),0 0 0 1.5px #c48a00}
.coinpill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:20px;padding:5px 14px 5px 7px;font:800 18px "Baloo 2";box-shadow:0 3px 0 var(--edge)}.coinpill.sm{font-size:16px;padding:4px 10px 4px 6px}
.cnt.inv{background:var(--gold)!important;color:#5a3a00!important}.cnt.buy{background:var(--green)!important}
#boost{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 4px);display:none;gap:9px;padding:10px 12px 4px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none}#boost::-webkit-scrollbar{display:none}
#boost.on{display:flex}#boost .bb{flex:none;width:54px;height:54px;border-radius:18px;background:#fff8fc;box-shadow:0 4px 0 #c79ab3,0 6px 14px rgba(60,20,40,.25);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0 0}
#boost .bb .ic svg{width:30px;height:30px;display:block}#boost .bb small{font:800 11px/1.1 "Baloo 2";color:var(--sub)}
#boost .bb .cnt{position:absolute;right:-6px;top:-7px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font:800 13px/22px "Baloo 2";text-align:center;padding:0 5px}
#boost .bb.act{outline:4px solid var(--pink);transform:translateY(-3px)}#boost .bb:active{transform:translateY(3px)}
#shopList{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;overflow:auto;padding:4px 2px 16px;touch-action:pan-y}
#shop{touch-action:pan-y}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--edge)}
.item .txt{flex:1;display:flex;flex-direction:column;line-height:1.2}.item .txt b{font:400 19px "Lilita One"}.item .txt span{font:600 13px "Baloo 2";color:var(--sub)}.item .txt em{font:800 13px "Baloo 2";font-style:normal;color:var(--pink-d);margin-top:2px}
.shopic{width:52px;height:52px;border-radius:16px;background:#ffeef6;display:grid;place-items:center;flex:none;margin:0 auto}.shopic svg{width:34px;height:34px}
.buyb{background:linear-gradient(180deg,#5ad888,#2fb35f);color:#fff;border-radius:16px;padding:9px 12px;font:800 16px "Baloo 2";box-shadow:0 4px 0 var(--green-d);white-space:nowrap}
.gain{font:400 30px "Lilita One";color:#c48a00;margin:-6px 0 12px}.gain i.coin{width:26px;height:26px;vertical-align:-3px}
.heart .hrt{font-style:normal;color:#ff4d6d;font-size:18px}.chestb{margin-top:2px}.chestb.ready{background:linear-gradient(180deg,#ffd76b,#ffb52e);color:#5a3a00;box-shadow:0 5px 0 #c48a00;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.chips{display:flex;gap:10px;justify-content:center}.chip{flex:1;max-width:140px;background:#fff;border-radius:18px;padding:10px 6px;box-shadow:0 4px 0 var(--edge);display:flex;flex-direction:column;align-items:center;gap:3px;border:3px solid transparent}
.chip b{font:400 15px/1.1 "Lilita One"}.chip small{font:800 12px "Baloo 2";color:var(--sub)}.chip.on{border-color:var(--green);background:#ecfff2}.chip .shopic{width:46px;height:46px}
.daily{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.dc{background:#fff;border-radius:14px;padding:6px 2px;box-shadow:0 3px 0 var(--edge);display:flex;flex-direction:column;align-items:center;font:800 15px "Baloo 2"}
.dc small{font:700 11px "Baloo 2";color:var(--sub)}.dc.done{opacity:.45}.dc.now{background:#fff1c9;outline:3px solid var(--gold)}.dc b{font-weight:800}.dc:last-child{grid-column:span 2}
#boost .bb.locked{opacity:.5;filter:grayscale(.7)}#boost .bb .cnt.lk{background:#8a5a78!important;font-size:11px}
#boost .bb.hint{animation:hint .8s infinite;outline:4px solid var(--green)}@keyframes hint{50%{transform:translateY(-6px)}}
#boost .bb.hint::after{content:"👆";position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:26px}
.item.locked{opacity:.55}.buyb[disabled]{background:#c9b8c2;box-shadow:0 4px 0 #a08a96}
.shopic.lg{width:76px;height:76px;margin:8px auto 2px}.shopic.lg svg{width:52px;height:52px}
.tabs{display:flex;gap:8px;background:#fff;border-radius:18px;padding:5px;box-shadow:0 3px 0 var(--edge)}.tabs button{flex:1;height:40px;border-radius:14px;font:400 18px "Lilita One";background:transparent;color:var(--sub)}.tabs button.on{background:var(--pink);color:#fff}
.buyb.wear{background:linear-gradient(180deg,#ff8dbd,#f0508f);box-shadow:0 4px 0 var(--pink-d)}
.cld-dot{position:absolute;right:3px;top:3px;width:10px;height:10px;border-radius:50%;background:#b8b0b8;border:2px solid #fff;transition:background .3s}
.cld-dot.synced{background:var(--green);box-shadow:0 0 6px rgba(63,196,111,.8)}
.cld-dot.sync{background:var(--gold);animation:pulse .6s infinite}
.cld-dot.error{background:var(--red)}
.card.wide{max-width:390px;max-height:86vh;overflow-y:auto;padding:20px 18px}
.cld-form{display:flex;flex-direction:column;gap:10px;width:100%}
.cld-input{height:46px;border-radius:15px;border:2px solid var(--edge);padding:0 14px;font:700 16px "Baloo 2";background:#fff;color:var(--ink);outline:0;box-shadow:inset 0 2px 4px rgba(0,0,0,.04);transition:border-color .2s}
.cld-input:focus{border-color:var(--pink)}
.cld-input::placeholder{color:#bfa2b3;font-weight:600}
.cloud-card{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 var(--edge);display:flex;align-items:center;justify-content:space-between;gap:10px}
.cloud-card b{display:block;font:400 17px "Lilita One";line-height:1.2}
.cloud-card span{display:block;font:700 13px "Baloo 2";color:var(--sub)}
.rank-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding-right:2px}
.rank-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 3px 0 var(--edge);font-family:"Baloo 2"}
.rank-item.me{outline:3px solid var(--pink);background:#fff2f8}
.rank-num{width:32px;font:400 20px "Lilita One";text-align:center;color:var(--sub)}
.rank-num.top{font-size:22px}
.rank-name{flex:1;text-align:left;font:700 16px "Baloo 2";overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.me-tag{font:800 10px "Baloo 2";background:var(--pink);color:#fff;border-radius:6px;padding:2px 6px;letter-spacing:.5px}
.rank-stars{font:800 17px "Lilita One";color:var(--gold-d);display:flex;align-items:center;gap:3px;white-space:nowrap}
</style></head><body>
<canvas id="c"></canvas>

<div id="home" class="scr on">
  <div class="topbar">
    <div style="display:flex;gap:8px"><button class="coinpill"><i class="coin"></i><span class="coinN">0</span></button><div class="coinpill heart"><i class="hrt">❤</i><span class="lifeN">5</span></div></div>

      <button class="ib" id="toCloud" aria-label="Bulut Hesabı"><svg viewBox="0 0 24 24" fill="none" stroke="#4a1f3a" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/></svg><span id="cloudDot" class="cld-dot"></span></button>
      <button class="ib" id="toSet" aria-label="Ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="#4a1f3a" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M5.2 18.8l2.1-2.1M16.7 7.3l2.1-2.1"/></svg></button>
    </div>
  </div>
  <div class="logo"><b>Şeker<br>Canavarları</b><span>Karamelleri çöz, canavarları doyur!</span></div>

  <div class="homebtns">
    <button class="big pink" id="play">Bölüm 1</button>

    <div style="display:flex;gap:12px"><button class="pill" id="toLeadBtn">🏆 Sıralama</button><button class="pill chestb" id="chestBtn">🎁 Sandık</button></div>

</div>

<div id="levels" class="scr">
  <div class="topbar"><button class="ib" data-back aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="#4a1f3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Bölümler</h2><div class="coinpill sm heart"><i class="hrt">❤</i><span class="lifeN">5</span></div></div>

  <div class="topbar"><button class="ib" data-back aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="#4a1f3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Ayarlar</h2><div style="width:46px"></div></div>
  <div class="set">
    <div class="cloud-card" id="setCloudCard">
      <div>
        <b id="cldUserTxt">Misafir Oyuncu</b>

      </div>

    </div>
    <label>Ses <input type="checkbox" id="optSnd"></label>
    <label>Titreşim <input type="checkbox" id="optVib"></label>

<div id="shop" class="scr">
  <div class="topbar"><button class="ib" data-back aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="#4a1f3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Market</h2><div class="coinpill sm"><i class="coin"></i><span class="coinN">0</span></div></div>
  <div id="shopList"></div>

  <div class="lt">
    <button class="ib" id="hHome" aria-label="Bölümler"><svg viewBox="0 0 24 24" fill="none" stroke="#4a1f3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg></button>

    <button class="ib" id="hUndo" aria-label="Geri al"><svg viewBox="0 0 24 24" fill="none" stroke="#4a1f3a" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span class="cnt" id="uc">3</span></button>

  </div>
</div>

<script>
// ===== Şeker Canavarları — kurallar =====
// L: {n,x[],r[],links:[{a,b}] (a=-1 çubuk), c[], q[] renk ('j' = joker, her rengi yer), qw[] 1|2 (obur=2), K kavanoz yeri, lock: renk|null, sh[] kabuk}
// S: alive[], rack[], qi, un (kilit açık), sh[], cl[] (makasla kesilen karamel), xl[] (kepçeyle birleşen yeni karameller {a,b})
function P_new(L){return {alive:new Array(L.n).fill(true),rack:[],qi:0,un:false,sh:(L.sh||[]).slice(),cl:new Array(L.links.length).fill(false),xl:[]};}
function P_clone(S){return {alive:S.alive.slice(),rack:S.rack.slice(),qi:S.qi,un:S.un,sh:S.sh.slice(),cl:S.cl.slice(),xl:S.xl.map(l=>({...l}))};}
function P_cap(L,S){return L.K+(L.lock&&S.un?1:0);}
function P_allLinks(L,S){const o=[];L.links.forEach((l,k)=>{if(!S.cl[k])o.push(l);});S.xl.forEach(l=>o.push(l));return o;}
function P_conn(L,S,skip){const ok=new Array(L.n).fill(false);let ch=true;const al=i=>S.alive[i]&&i!==skip;const LK=P_allLinks(L,S);
  LK.forEach(l=>{if(l.a<0&&al(l.b))ok[l.b]=true;});
  // karamel iki yönlü tutar: bağlı iki şekerden biri çubuğa ulaşıyorsa diğeri de ulaşır
  while(ch){ch=false;LK.forEach(l=>{if(l.a<0||!al(l.a)||!al(l.b))return;if(ok[l.a]&&!ok[l.b]){ok[l.b]=true;ch=true;}else if(ok[l.b]&&!ok[l.a]){ok[l.a]=true;ch=true;}});}return ok;}

        pop('<h3>Bulut Kaydı Bulundu</h3><p>Buluttaki ilerlemen: <b>Bölüm '+(cloudData.un||1)+'</b> ('+cloudStars+' ★)<br>Cihazdaki ilerlemen: <b>Bölüm '+SV.un+'</b> ('+localStars+' ★)<br><br>Buluttaki ilerlemen yüklensin mi?</p><div class="btns"><button class="big" id="pLoadCloud">Buluttan Yükle</button><button class="pill" id="pKeepLocal">Cihazdakini Koru</button></div>');
        if($('pLoadCloud'))$('pLoadCloud').onclick=()=>{applyCloudData(cloudData);closePop();toast('Bulut kaydı yüklendi!');};
        if($('pKeepLocal'))$('pKeepLocal').onclick=()=>{closePop();cloudSaveDebounced();toast('Cihazdaki ilerleme buluta eşitlendi.');};
      }else{
        cloudSaveDebounced();
      }
    }else{
      cloudSaveDebounced();
    }
  }catch(e){
    console.error('Bulut save kontrolü hatası:',e);
  }
}

async function handleUserSession(user){
  sbUser=user;
  try{
    const {data:prof}=await sb.from('profiles').select('nickname, stars').eq('user_id',user.id).maybeSingle();
    if(prof){
      sbProfile=prof;
    }else{
      const nick=(user.user_metadata&&user.user_metadata.nickname)||user.email.split('@')[0]||'Şekersever';
      sbProfile={nickname:nick,stars:totalStars()};
      await sb.from('profiles').upsert({
        user_id:user.id,
        nickname:nick,
        stars:totalStars(),
        updated_at:new Date().toISOString()
      });
    }
    updateCloudUI();
    await checkCloudSave();
  }catch(e){
    console.error('Kullanıcı profil hatası:',e);
  }
  updateCloudUI();
}

async function initSupabase(){
  if(!window.supabase||!window.supabase.createClient)return;
  try{
    sb=window.supabase.createClient(SB_URL,SB_KEY,{
      auth:{persistSession:true,autoRefreshToken:true}
    });
    const {data:{session}}=await sb.auth.getSession();
    if(session&&session.user){
      await handleUserSession(session.user);
    }else{
      updateCloudUI();
    }
    sb.auth.onAuthStateChange(async(evt,session)=>{
      if(session&&session.user){
        await handleUserSession(session.user);
      }else{
        sbUser=null;sbProfile=null;
        updateCloudUI();
      }
    });
  }catch(e){
    console.error('Supabase başlatma hatası:',e);
  }
}

function openAccountModal(){
  if(sbUser){
    const nick=(sbProfile&&sbProfile.nickname)||(sbUser.user_metadata&&sbUser.user_metadata.nickname)||'Şekersever';
    pop('<div class="card wide"><h3>Oyuncu Profili</h3><p style="margin:4px 0 12px">Bulut hesabın aktif. İlerlemen eşitleniyor.</p><div style="background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 0 var(--edge);margin-bottom:12px;text-align:left"><div style="font-size:13px;color:var(--sub);font-weight:700">Oyuncu Adı</div><div style="display:flex;gap:6px;margin-top:4px"><input type="text" id="accNick" class="cld-input" value="'+escapeHtml(nick)+'" maxlength="16" style="flex:1"><button class="pill" id="accSaveNick" style="height:46px;padding:0 14px">Kaydet</button></div><div style="margin-top:10px;font-size:14px;color:var(--sub)"><b>E-posta:</b> '+escapeHtml(sbUser.email)+'</div><div style="margin-top:4px;font-size:14px;color:var(--sub)"><b>İlerleme:</b> Bölüm '+SV.un+' · '+totalStars()+' ★</div></div><div class="btns"><button class="pill" id="accSyncNow">☁️ Şimdi Buluta Kaydet</button><button class="pill" id="accLoadNow">⬇️ Buluttan Yükle</button><button class="pill" id="accSignOut" style="color:var(--red-d)">🚪 Çıkış Yap</button><button class="pill" id="accClose">Kapat</button></div></div>');
    $('accSaveNick').onclick=async()=>{
      const newNick=$('accNick').value.trim();
      if(!newNick){toast('Lütfen geçerli bir isim girin');return;}
      try{
        await sb.from('profiles').upsert({
          user_id:sbUser.id,
          nickname:newNick,
          stars:totalStars(),
          updated_at:new Date().toISOString()
        });
        if(sbProfile)sbProfile.nickname=newNick;
        updateCloudUI();
        toast('İsim güncellendi!');
      }catch(e){toast('İsim güncellenemedi');}
    };
    $('accSyncNow').onclick=()=>{cloudSaveDebounced();toast('Buluta kaydediliyor...');closePop();};
    $('accLoadNow').onclick=async()=>{await checkCloudSave(true);closePop();};
    $('accSignOut').onclick=async()=>{await sb.auth.signOut();closePop();toast('Çıkış yapıldı');};
    $('accClose').onclick=closePop;
  }else{
    pop('<div class="card wide"><div class="tabs" style="margin-bottom:14px"><button class="on" id="tabLogin">Giriş Yap</button><button id="tabRegister">Kayıt Ol</button></div><div id="loginForm" class="cld-form"><input type="email" id="authEmail" class="cld-input" placeholder="E-posta adresi"><input type="password" id="authPass" class="cld-input" placeholder="Şifre"><button class="big" id="btnSubmitLogin" style="margin-top:6px">Giriş Yap</button></div><div id="registerForm" class="cld-form" style="display:none"><input type="text" id="regNick" class="cld-input" placeholder="Oyuncu Adı (Nickname)" maxlength="16"><input type="email" id="regEmail" class="cld-input" placeholder="E-posta adresi"><input type="password" id="regPass" class="cld-input" placeholder="Şifre (en az 6 karakter)"><button class="big pink" id="btnSubmitRegister" style="margin-top:6px">Kayıt Ol</button></div><div id="authMsg" style="margin-top:8px;font-size:13px;font-weight:700;color:var(--sub);min-height:18px"></div><button class="pill" id="accClose" style="margin-top:8px">Vazgeç</button></div>');
    let isLoginTab=true;
    $('tabLogin').onclick=()=>{
      isLoginTab=true;
      $('tabLogin').classList.add('on');$('tabRegister').classList.remove('on');
      $('loginForm').style.display='flex';$('registerForm').style.display='none';
      $('authMsg').textContent='';
    };
    $('tabRegister').onclick=()=>{
      isLoginTab=false;
      $('tabRegister').classList.add('on');$('tabLogin').classList.remove('on');
      $('registerForm').style.display='flex';$('loginForm').style.display='none';
      $('authMsg').textContent='';
    };
    $('btnSubmitLogin').onclick=async()=>{
      const email=$('authEmail').value.trim(),password=$('authPass').value;
      if(!email||!password){$('authMsg').textContent='Lütfen e-posta ve şifrenizi girin.';return;}
      $('btnSubmitLogin').disabled=true;$('btnSubmitLogin').textContent='Giriş yapılıyor...';
      try{
        const {data,error}=await sb.auth.signInWithPassword({email,password});
        if(error)throw error;
        toast('Giriş başarılı!');
        closePop();
      }catch(e){
        let msg=e.message||'Giriş yapılamadı.';
        if(msg.includes('Email not confirmed'))msg='E-posta onaylanmamış! (Supabase panelinden email confirm kapatılabilir)';
        if(msg.includes('Invalid login credentials'))msg='Hatalı e-posta veya şifre!';
        $('authMsg').textContent=msg;
        $('btnSubmitLogin').disabled=false;$('btnSubmitLogin').textContent='Giriş Yap';
      }
    };
    $('btnSubmitRegister').onclick=async()=>{
      const nick=$('regNick').value.trim()||'Şekersever';
      const email=$('regEmail').value.trim(),password=$('regPass').value;
      if(!email||!password){$('authMsg').textContent='Lütfen e-posta ve şifre girin.';return;}
      if(password.length<6){$('authMsg').textContent='Şifre en az 6 karakter olmalı.';return;}
      $('btnSubmitRegister').disabled=true;$('btnSubmitRegister').textContent='Kaydediliyor...';
      try{
        const {data,error}=await sb.auth.signUp({
          email,password,
          options:{data:{nickname:nick}}
        });
        if(error)throw error;
        if(data.session){
          toast('Hoş geldin, '+nick+'!');
          closePop();
        }else{
          $('authMsg').textContent='Kayıt oluşturuldu! E-postanızı onaylayın veya panele girip onay ayarını kapatın.';
          toast('Kayıt başarılı!');
        }
      }catch(e){
        $('authMsg').textContent=e.message||'Kayıt oluşturulamadı.';
        $('btnSubmitRegister').disabled=false;$('btnSubmitRegister').textContent='Kayıt Ol';
      }
    };
    $('accClose').onclick=closePop;
  }
}

async function openLeaderboardModal(){
  pop('<div class="card wide"><div style="font-size:42px;line-height:1">🏆</div><h3 style="margin:2px 0 4px">Liderlik Tablosu</h3><p style="margin:0 0 12px;font-size:14px">En çok yıldız toplayan şeker canavarları!</p><div id="leadContent" style="min-height:150px;display:flex;align-items:center;justify-content:center"><span style="font-weight:800;color:var(--sub)">Yükleniyor...</span></div><div class="btns" style="margin-top:14px">'+(!sbUser?'<button class="big pink" id="leadLoginBtn" style="margin-bottom:4px">Sıralamaya Katıl (Giriş Yap)</button>':'')+'<button class="pill" id="leadClose">Kapat</button></div></div>');
  if($('leadLoginBtn'))$('leadLoginBtn').onclick=()=>{closePop();openAccountModal();};
  $('leadClose').onclick=closePop;
  if(!sb){
    $('leadContent').innerHTML='<span style="color:var(--red-d)">Supabase bağlantısı kurulamadı.</span>';
    return;
  }
  try{
    const {data:rows,error}=await sb.from('profiles').select('user_id, nickname, stars').order('stars',{ascending:false}).limit(25);
    if(error)throw error;
    if(!rows||rows.length===0){
      $('leadContent').innerHTML='<div style="color:var(--sub);font-weight:700;padding:24px 0">Henüz kimse sıralamada yok.<br>İlk giren sen ol! 🌟</div>';
      return;
    }
    const items=rows.map((r,i)=>{
      const isMe=sbUser&&r.user_id===sbUser.id;
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
      return '<div class="rank-item'+(isMe?' me':'')+'"><div class="rank-num '+(i<3?'top':'')+'">'+medal+'</div><div class="rank-name">'+escapeHtml(r.nickname||'Şekersever')+(isMe?' <span class="me-tag">SEN</span>':'')+'</div><div class="rank-stars">'+(r.stars||0)+' <span style="color:var(--gold)">★</span></div></div>';
    }).join('');
    $('leadContent').innerHTML='<div class="rank-list">'+items+'</div>';
  }catch(e){
    console.error('Liderlik hatası:',e);
    $('leadContent').innerHTML='<span style="color:var(--red-d)">Sıralama alınamadı.</span>';
  }
}

$('play').onclick=()=>{ac();if(SV.un>LEVELS.length)show('levels');else goLevel(SV.un);};$('toLv').onclick=()=>{ac();show('levels');};$('toSet').onclick=()=>{$('optSnd').checked=SV.snd;$('optVib').checked=SV.vib;$('optAll').checked=SV.all;$('optInf').checked=SV.inf;show('settings');};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show('home'));$('toShop').onclick=()=>{ac();show('shop');};document.querySelectorAll('.coinpill').forEach(b=>b.onclick=()=>{ac();show('shop');});

if($('toLeadBtn'))$('toLeadBtn').onclick=()=>{ac();openLeaderboardModal();};

$('setCloudBtn').onclick=()=>{ac();openAccountModal();};
$('optSnd').onchange=e=>{SV.snd=e.target.checked;save();};$('optVib').onchange=e=>{SV.vib=e.target.checked;save();};$('optAll').onchange=e=>{SV.all=e.target.checked;save();};
$('reset').onclick=()=>{SV.un=1;SV.st={};SV.coins=200;SV.inv={undo:1,hammer:0,skip:0,taps:0,mag:0,scis:0,scoop:0,snack:0,slot:0,joker:0};SV.seen={};SV.used={};SV.lives=5;SV.chests=0;save();toast('İlerleme sıfırlandı');};$('optInf').onchange=e=>{SV.inf=e.target.checked;save();refreshLives();};$('chestBtn').onclick=()=>{ac();openChest();};
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000)*(window.__SPEED||1);last=now;update(dt);draw();requestAnimationFrame(loop);}
addEventListener('resize',()=>{layout();});
setLevel(Math.min(SV.un,LEVELS.length));show('home');requestAnimationFrame(loop);
window.__K={L:()=>L,sxy:s=>[slotX(s),slotY(s)],lives:()=>livesNow(),G:()=>G,tap:i=>doTap(i),idle:()=>idle(),close:closePop,go:n=>goLevel(n),show};
if(window.supabase&&window.supabase.createClient){initSupabase();}else{window.addEventListener('load',initSupabase);}

})();
